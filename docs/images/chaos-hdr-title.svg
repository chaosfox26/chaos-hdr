  <style>
    .jitter{animation:jitter 3.4s steps(1,end) infinite}
    .split{opacity:0;animation:split 3.4s steps(1,end) infinite}
    .slice{opacity:0;animation:slice 3.4s steps(1,end) infinite}
    @keyframes jitter{0%,7%,16%,19%,25%,63%,72%,100%{transform:translate(0,0)}9%,21%{transform:translate(3px,-1px)}11%,67%{transform:translate(-3px,1px)}13%,69%{transform:translate(1px,0)}}
    @keyframes split{0%,7%,16%,19%,25%,63%,72%,100%{opacity:0}9%,13%,21%,67%,69%{opacity:.45}}
    @keyframes slice{0%,9%,15%,20%,24%,65%,71%,100%{opacity:0;transform:translate(0,0)}11%,22%,67%{opacity:.8;transform:translate(12px,0)}13%,69%{opacity:.55;transform:translate(-9px,0)}}
    @media(prefers-reduced-motion:reduce){.jitter,.split,.slice{animation:none}}
  </style>
  <rect width="1044" height="216" fill="#0d1117"/>
