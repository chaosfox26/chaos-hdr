name: Publish website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/chaos-hdr-sidebar.png'
      - 'vendor/fonts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - run: python3 -B site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
